<style>
/* Layout: fixed 390x844 phone canvas — status bar, scrolling screen, bottom tab bar. */
:root{
  --ink:#0E1A20; --ink2:#4E6069; --ink3:#8599A2;
  --bg:#EEF2F4; --surf:#FFFFFF; --surf2:#F4F8F9; --line:#E2EAEC;
  --brand:#0C5A5F; --brand2:#0A4448; --brandSoft:#DFF0F0;
  --accent:#E08A1E; --accentSoft:#FDF0DC;
  --ok:#157A52; --okSoft:#DDF2E8;
  --warn:#B4410F; --warnSoft:#FDEAE0;
  --fd:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --fb:"IBM Plex Sans Thai",system-ui,sans-serif;
  --fn:"IBM Plex Mono",ui-monospace,monospace;
  --r:20px;
  --sh:0 1px 2px rgba(14,26,32,.05), 0 10px 26px rgba(14,26,32,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#D9E1E5;font-family:var(--fb);color:var(--ink);
     display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------------- phone ---------------- */
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;
       display:flex;flex-direction:column}
@media (min-width:520px) and (min-height:900px){
  .phone{border-radius:44px;box-shadow:0 30px 80px rgba(14,26,32,.3);border:1px solid #C9D5DA}
}
@media (max-width:430px){ body{display:block} .phone{width:100vw;height:100vh} }

/* status bar */
.sbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;
      padding:0 26px;position:relative;z-index:30;font-family:var(--fn);font-size:13.5px;
      font-weight:600;letter-spacing:.2px}
.notch{position:absolute;left:50%;transform:translateX(-50%);top:9px;width:108px;height:30px;
       border-radius:16px;background:#0E1A20}
.sbar .rt{display:flex;align-items:center;gap:5px}
.sig{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.sig i{width:3px;background:var(--ink);border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}
.sig i:nth-child(3){height:8.5px}.sig i:nth-child(4){height:11px}
.bat{width:24px;height:12px;border:1.6px solid var(--ink);border-radius:3.5px;position:relative;padding:1.5px}
.bat::after{content:"";position:absolute;right:-3.4px;top:3.4px;width:2px;height:5px;
            background:var(--ink);border-radius:0 1px 1px 0}
.bat span{display:block;height:100%;width:76%;background:var(--ink);border-radius:1.5px}

/* screens */
.scr{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
      padding:4px 20px 26px;display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.view::-webkit-scrollbar{display:none}

/* type */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
         color:var(--ink3);margin:0}
h1{font-family:var(--fd);font-size:27px;font-weight:700;margin:2px 0 0;letter-spacing:-.2px}
h2{font-family:var(--fd);font-size:17px;font-weight:600;margin:0}
.sub{color:var(--ink2);font-size:13.5px;margin:0}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;font-weight:600}

/* header row */
.htop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.bell{width:42px;height:42px;border-radius:50%;background:var(--surf);box-shadow:var(--sh);
      display:grid;place-items:center;position:relative;flex:0 0 auto}
.bell::after{content:"";position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;
             background:var(--accent);border:1.5px solid #fff}
.back{display:flex;align-items:center;gap:10px;padding-top:4px}
.back button{width:38px;height:38px;border-radius:50%;background:var(--surf);box-shadow:var(--sh);
             display:grid;place-items:center;flex:0 0 auto}

/* cards */
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card.tight{padding:14px}
.row{display:flex;align-items:center;gap:12px}
.row.sb{justify-content:space-between}
.ico{width:42px;height:42px;border-radius:13px;background:var(--brandSoft);color:var(--brand);
     display:grid;place-items:center;flex:0 0 auto}
.ico.am{background:var(--accentSoft);color:var(--accent)}
.ico.ok{background:var(--okSoft);color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
      padding:4px 10px;border-radius:999px;background:var(--okSoft);color:var(--ok)}
.pill.am{background:var(--accentSoft);color:var(--accent)}
.pill.gy{background:var(--surf2);color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip{font-family:var(--fn);font-size:11px;background:var(--surf2);color:var(--ink2);
      padding:3px 8px;border-radius:7px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

/* buttons */
.btn{display:block;width:100%;border-radius:16px;padding:16px;font-family:var(--fd);font-weight:600;
     font-size:16px;background:var(--brand);color:#fff;text-align:center;
     box-shadow:0 8px 20px rgba(12,90,95,.26)}
.btn.am{background:var(--accent);box-shadow:0 8px 20px rgba(224,138,30,.3)}
.btn.gh{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
.btn[disabled]{background:#D7E0E3;color:#93A5AC;box-shadow:none}
.cta{display:flex;align-items:center;gap:14px;background:var(--brand);color:#fff;border-radius:var(--r);
     padding:16px;box-shadow:0 10px 24px rgba(12,90,95,.3)}
.cta .ico{background:rgba(255,255,255,.17);color:#fff}
.cta b{font-family:var(--fd);font-size:17px;display:block}
.cta span{font-size:12.5px;opacity:.82}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:16px;
      padding:13px;box-shadow:var(--sh);width:100%;text-align:left}
.item.sel{outline:2px solid var(--brand);background:var(--brandSoft)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:14.5px}
.item .t span{display:block;color:var(--ink2);font-size:12.5px}
.rate{font-family:var(--fn);font-weight:600;color:var(--accent);white-space:nowrap;font-size:15px}
.rate small{font-size:10.5px;color:var(--ink3);font-weight:500}
.cam{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#E7F1F1,#D3E6E6);
     display:grid;place-items:center;color:var(--brand);flex:0 0 auto}

/* rows of values */
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--ink2)}
.kv b{font-family:var(--fn);font-weight:600}
.kv.total b{font-size:18px;color:var(--accent)}

/* hour picker */
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hours button{background:var(--surf);border-radius:14px;padding:11px 0;font-family:var(--fn);
              font-weight:600;font-size:14px;box-shadow:var(--sh)}
.hours button[aria-pressed=true]{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(12,90,95,.3)}

/* fields */
.field{background:var(--surf);border-radius:16px;box-shadow:var(--sh);padding:12px 14px;
       display:flex;align-items:center;gap:12px}
.field label{display:block;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.4px;
             text-transform:uppercase}
.field input{border:0;outline:0;width:100%;font-family:var(--fn);font-size:15px;color:var(--ink);
             background:transparent;padding:0;margin-top:1px}
.otp{display:flex;gap:9px}
.otp i{flex:1;height:54px;border-radius:14px;background:var(--surf);box-shadow:var(--sh);
       display:grid;place-items:center;font-family:var(--fn);font-size:21px;font-weight:600;
       font-style:normal}

/* gauge + charts */
.gauge{display:grid;place-items:center;padding:6px 0 2px}
.gauge .mid{position:absolute;text-align:center}
.gwrap{position:relative;display:grid;place-items:center}
.clock{font-family:var(--fn);font-size:34px;font-weight:600;letter-spacing:-.5px;
       font-variant-numeric:tabular-nums;color:var(--brand2);line-height:1}

/* scanner */
.finder{aspect-ratio:1;border-radius:24px;background:linear-gradient(160deg,#10343A,#0A2126);
        position:relative;overflow:hidden;display:grid;place-items:center}
.finder i{position:absolute;width:40px;height:40px;border:3px solid rgba(255,255,255,.9)}
.finder i:nth-child(1){top:16px;left:16px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.finder i:nth-child(2){top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.finder i:nth-child(3){bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.finder i:nth-child(4){bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.laser{position:absolute;left:18px;right:18px;height:2px;background:var(--accent);
       box-shadow:0 0 16px var(--accent);animation:sw 2.2s ease-in-out infinite}
@keyframes sw{0%,100%{top:20%}50%{top:80%}}
.qr{width:56%;aspect-ratio:1;display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);gap:2px;opacity:.55}
.qr b{background:#EAF3F3;border-radius:1px}
.qr b.o{background:transparent}
.log{font-family:var(--fn);font-size:11.5px;background:var(--surf);border-radius:16px;padding:13px;
     box-shadow:var(--sh);display:flex;flex-direction:column;gap:5px;color:var(--ink2)}
.log b{color:var(--ok);font-weight:600}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .n{position:relative;margin-bottom:12px}
.tl .n::before{content:"";position:absolute;left:-21px;top:16px;width:10px;height:10px;
               border-radius:50%;background:var(--brand);border:2px solid #fff}
.tl .d{font-size:11.5px;color:var(--ink3);font-weight:600;margin:14px 0 8px}

/* bottom tabs */
.tabs{flex:0 0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
      border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
      padding:9px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
             color:var(--ink3);font-weight:500}
.tabs button.on{color:var(--brand);font-weight:600}
.tabs.hide{display:none}
.hbar{flex:0 0 auto;height:22px;display:grid;place-items:center;background:rgba(255,255,255,.92)}
.hbar i{display:block;width:134px;height:5px;border-radius:3px;background:#0E1A20;opacity:.85}
.hbar.dark{background:transparent}

svg{display:block}
.demo{position:absolute;top:58px;right:14px;z-index:40;font-family:var(--fn);font-size:9.5px;
      font-weight:600;letter-spacing:.8px;background:var(--accentSoft);color:var(--warn);
      padding:3px 8px;border-radius:6px}
</style>

function pay(i,t,s,sel){
 return '<div class="item'+(sel?' sel':'')+'"><span class="ico">'+ic(i,20)+'</span>'+
  '<span class="t"><b>'+t+'</b><span>'+s+'</span></span>'+
  '<span style="width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;'+
  (sel?'background:var(--brand);color:#fff':'border:1.6px solid var(--line)')+'">'+(sel?ic('check',13):'')+'</span></div>';
}
function qrart(){
 var h='';
 for(var i=0;i<81;i++){var r=Math.floor(i/9),c=i%9,
   fp=(r<3&&c<3)||(r<3&&c>5)||(r>5&&c<3);
   h+='<b class="'+(fp?((r%2===1&&c%2===1)?'o':''):(((i*7+r*3)%3)?'':'o'))+'"></b>';}
 return '<div class="qr" style="width:150px;opacity:.9">'+h+'</div>';
}

 '</div>'+

function qrcells(){
 var h='';
 for(var i=0;i<81;i++){var r=Math.floor(i/9),c=i%9,
   fp=(r<3&&c<3)||(r<3&&c>5)||(r>5&&c<3);
   h+='<b class="'+(fp?((r%2===1&&c%2===1)?'o':''):(((i*5+c*3)%3)?'':'o'))+'"></b>';}
 return h;
}

function bars(){
 var d=[3,5,2,6,4,7,5,8], lb=['มี.ค','เม.ย','พ.ค','มิ.ย','ก.ค','ส.ค','ก.ย','ต.ค'];
 var mx=8, W=306, H=96, bw=22, gap=(W-d.length*bw)/(d.length-1);
 var b='',t='';
 d.forEach(function(v,i){
   var h=v/mx*H, x=i*(bw+gap);
   b+='<rect x="'+x.toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+
      '" rx="6" fill="'+(i===d.length-1?'#0C5A5F':'#BFDCDC')+'"/>';
   t+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H+15)+'" text-anchor="middle" font-size="10" '+
      'fill="#8599A2" font-family="IBM Plex Sans Thai">'+lb[i]+'</text>';
 });
 return '<svg viewBox="0 0 '+W+' '+(H+20)+'" width="100%" height="'+(H+20)+'">'+b+t+'</svg>';
}

  }).join('');
}

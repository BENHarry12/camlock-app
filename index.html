<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C5A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CamLock — ตู้เช่ากล้องอัตโนมัติ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230C5A5F%22/%3E%3Cpath d=%22M6 9h2.5l1-1.5h5l1 1.5H18v8H6z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2212%22 cy=%2212.5%22 r=%222%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#0E1A20;--ink2:#4E6069;--ink3:#8599A2;
  --bg:#EEF2F4;--surf:#FFFFFF;--surf2:#F4F8F9;--line:#E2EAEC;
  --brand:#0C5A5F;--brand2:#0A4448;--brandSoft:#DFF0F0;
  --accent:#E08A1E;--accentSoft:#FDF0DC;
  --ok:#157A52;--okSoft:#DDF2E8;--warn:#B4410F;--warnSoft:#FDEAE0;
  --fd:"Bai Jamjuree","IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --fb:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --fn:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;--sh:0 1px 2px rgba(14,26,32,.05),0 10px 26px rgba(14,26,32,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:var(--fb);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{position:relative;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;overflow:clip}
.app{height:100vh;height:100dvh}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:max(18px,env(safe-area-inset-top)) max(18px,calc((100% - 760px)/2)) 24px;scroll-behavior:smooth}
.scr::-webkit-scrollbar{display:none}
.tabs{display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 6px max(10px,env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0;font-weight:500}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--brand);font-weight:600}
.tabs button .badge{position:absolute;margin:-2px 0 0 18px;background:var(--accent);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.hide{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.2px}
h1{font-size:27px;font-weight:700;line-height:1.25}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:600}
.muted{color:var(--ink3)}.sm{font-size:13px}.xs{font-size:12px}
.mono{font-family:var(--fn)}
.top{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.top .grow{flex:1}
.hello{font-size:13px;color:var(--ink3)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surf);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.back{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surf);box-shadow:var(--sh);display:grid;place-items:center}
.back h2{font-size:19px}
.demo{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;z-index:5;font-family:var(--fn);font-size:10px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:2px 7px;border-radius:6px;letter-spacing:.5px;pointer-events:none}
.card{background:var(--surf);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.hero{background:linear-gradient(140deg,var(--brand),var(--brand2));color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 12px 30px rgba(12,90,95,.28);position:relative;overflow:hidden}
.hero .lbl{font-size:12px;opacity:.7}
.hero h3{color:#fff;font-size:18px;margin:2px 0}
.hero .sub{font-size:13px;opacity:.8}
.hero .pin{position:absolute;right:16px;top:18px;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;background:#5EE6A8}
.chip .d.off{background:#F7B267}
.cta{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;background:var(--brand);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 10px 24px rgba(12,90,95,.25)}
.cta .ic{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.cta b{font-family:var(--fd);font-size:17px;display:block}
.cta span{font-size:13px;opacity:.8}
.cta.amber{background:var(--accent);box-shadow:0 10px 24px rgba(224,138,30,.28)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surf);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.tile .k{font-size:12px;color:var(--ink3)}
.tile .v{font-family:var(--fd);font-weight:700;font-size:17px}
.ic.teal{background:var(--brandSoft);color:var(--brand)}.ic.ok{background:var(--okSoft);color:var(--ok)}.ic.amber{background:var(--accentSoft);color:var(--accent)}.ic.warn{background:var(--warnSoft);color:var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--okSoft);color:var(--ok)}.tag.teal{background:var(--brandSoft);color:var(--brand)}.tag.amber{background:var(--accentSoft);color:#A35F0A}.tag.warn{background:var(--warnSoft);color:var(--warn)}.tag.grey{background:#EDF1F2;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.sec{display:flex;align-items:center;margin:20px 0 10px}
.sec h2{flex:1}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv b{font-family:var(--fd);font-weight:600;text-align:right}
.cam{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid transparent;background:var(--surf);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.cam.sel{border-color:var(--brand);background:var(--brandSoft)}
.cam.dis{opacity:.55}
.cam .ph{width:48px;height:48px;border-radius:14px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;flex:none}
.cam .nm{font-family:var(--fd);font-weight:700;font-size:15px}
.cam .ln{font-size:12px;color:var(--ink2)}
.specs{display:flex;flex-direction:column;gap:2px;background:var(--surf2);border-radius:8px;padding:5px 8px;margin-top:6px;font-family:var(--fn);font-size:12px;color:var(--ink2)}
.price{text-align:right;flex:none}
.price b{font-family:var(--fd);color:var(--accent);font-size:16px}
.price small{display:block;font-size:11px;color:var(--ink3)}
.hrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hrs button{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 0;font-family:var(--fd);font-weight:600}
.hrs button.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surf);border-radius:14px;padding:12px;margin-bottom:8px}
.opt.on{border-color:var(--brand);background:var(--brandSoft)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.opt.on .rd{border:5px solid var(--brand)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:1.5px dashed var(--line)}
.total b{font-family:var(--fd);font-size:24px;color:var(--brand)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-family:var(--fd);font-weight:700;font-size:16px;background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(12,90,95,.22);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.amber{background:var(--accent);box-shadow:0 8px 20px rgba(224,138,30,.25)}
.btn.ghost{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
.btn.danger{background:var(--warnSoft);color:var(--warn);box-shadow:none}
.btn.sm{width:auto;padding:8px 13px;font-size:13px;border-radius:11px;box-shadow:none}
.btn.sm.ghost{background:var(--surf2);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.field{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:16px;padding:10px 14px;box-shadow:var(--sh);margin-bottom:10px;border:1.5px solid transparent}
.field:focus-within{border-color:var(--brand)}
.field .ic{width:36px;height:36px;border-radius:11px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;flex:none}
.field label{display:block;font-size:11px;color:var(--ink3)}
.field input,.field select{border:0;outline:0;background:none;width:100%;padding:0;font-size:15px;font-weight:500}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surf);outline:0;margin-bottom:10px}
.inp:focus{border-color:var(--brand)}
.lb{display:block;font-size:12px;color:var(--ink2);margin:0 0 4px}
.auth{min-height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(140deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 12px 26px rgba(12,90,95,.3)}
.logo svg{width:30px;height:30px}
.center{text-align:center}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0}
.ring{position:relative;width:180px;height:180px;margin:6px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.clock{font-family:var(--fn);font-weight:600;font-size:27px;color:var(--brand);letter-spacing:1px}
.term{background:var(--surf);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);font-family:var(--fn);font-size:12.5px;line-height:1.9;color:var(--ink2);margin-bottom:12px}
.term .s{display:flex;gap:8px;align-items:center}
.term .s .m{width:16px;text-align:center}
.term .s.done{color:var(--ink)}.term .s.done .m{color:var(--ok)}
.term .s.now{color:var(--brand);font-weight:600}
.term .s.wait{opacity:.4}
.term b{color:var(--ok)}
.scan{position:relative;aspect-ratio:1/1;border-radius:22px;background:radial-gradient(circle at 50% 40%,#16454B,#0B2A2E);display:grid;place-items:center;margin-bottom:12px;overflow:hidden}
.scan .lk{width:120px;height:120px;border-radius:34px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#9FD8D8;transition:.3s}
.scan .lk svg{width:64px;height:64px;stroke-width:1.5}
.scan.open .lk{background:rgba(94,230,168,.16);color:#5EE6A8;transform:scale(1.06)}
.scan .cn{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.75)}
.scan .cn.a{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.scan .cn.b{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.scan .cn.c{bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 10px}.scan .cn.d{bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scan .ln{position:absolute;left:16px;right:16px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scanl 2.2s ease-in-out infinite}
.scan .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#CDE7E7;font-size:13px}
@keyframes scanl{0%,100%{top:22%}50%{top:76%}}
.qr{background:#fff;border-radius:18px;padding:14px;width:230px;margin:6px auto 8px;box-shadow:var(--sh)}
.qr svg{display:block;width:100%;height:auto}
.pp{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--fd);font-weight:700;color:#0F3A68;margin-bottom:2px}
.spin{width:18px;height:18px;border:2.5px solid var(--brandSoft);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--brandSoft);min-height:4px}
.bars div.cur i{background:var(--brand)}
.bars span{font-size:10.5px;color:var(--ink3)}
.av{width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;font-family:var(--fd);font-weight:700;font-size:20px;display:grid;place-items:center;flex:none}
.menu .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.menu .it:last-child{border-bottom:0}
.menu .it .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:26px 10px;color:var(--ink3)}
.empty .ic{width:60px;height:60px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:12px}
.alert.warn{background:var(--warnSoft);color:#7D2E0A}.alert.amber{background:var(--accentSoft);color:#7A4A08}.alert.teal{background:var(--brandSoft);color:var(--brand2)}.alert.ok{background:var(--okSoft);color:#0E5239}
.alert svg{margin-top:1px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1.5px solid var(--line);background:var(--surf);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--ink2);white-space:nowrap}
.filters button.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:600}
.rcard{background:var(--surf);border-radius:16px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.rcard .meta{font-size:12.5px;color:var(--ink2)}
.toggle{position:relative;width:46px;height:28px;border-radius:99px;background:#CBD6D9;border:0;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)}.toggle.on::after{left:21px}
.logl{font-size:13px}
.logl .it{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.logl time{flex:none;width:86px;font-size:11.5px;color:var(--ink3);padding-top:1px}
.logl .w{color:var(--warn)}
.sheet-bg{position:absolute;inset:0;background:rgba(14,26,32,.42);z-index:20;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px max(20px,env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#C9D4D7;margin:0 auto 14px}
.toast{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,calc(-100% - 60px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:40;transition:transform .3s;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.on{transform:translate(-50%,0)}
.door{display:flex;align-items:center;gap:12px}
.door .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.pulse{animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps div{display:flex;gap:10px;font-size:13.5px;color:var(--ink2)}
.steps div::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--brandSoft);color:var(--brand);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:18px}

/* ---------- โมเดล 3 มิติ ---------- */
.stage{position:relative;height:330px;border-radius:22px;background:radial-gradient(circle at 50% 35%,#1B4F56,#0B2A2E 75%);perspective:900px;overflow:hidden;margin-bottom:12px;touch-action:none;cursor:grab;user-select:none}
.stage.drag{cursor:grabbing}
.scene{position:absolute;left:58%;top:47%;width:0;height:0;transform-style:preserve-3d;transition:transform .15s}
.cab3d,.cam3d,.cam3d-in{position:absolute;transform-style:preserve-3d}
.fc{position:absolute;left:0;top:0;backface-visibility:visible}
.floor{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;transform:translateY(112px) rotateX(90deg);background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);}
.cab-back{background:linear-gradient(#24484D,#1A383C)}
.cab-side{background:linear-gradient(160deg,#4E8C93,#2F6268);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.cab-top{background:linear-gradient(#6AAAB0,#4B8A90)}
.cab-bottom{background:#1E3E42}
.cab-shelf{background:linear-gradient(#3A6F75,#2B575C);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.cab-strike{background:#8FA3A6;border-radius:2px}
.bolt{position:absolute;left:-14px;top:9px;width:18px;height:8px;border-radius:2px;background:linear-gradient(#E9EEF0,#9AA9AC);transition:transform .25s}
.scene.unlocked .bolt{transform:translateX(12px)}
.door3d{position:absolute;transform-style:preserve-3d;transform:translateZ(75px);transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.scene.ajar .door3d{transform:translateZ(75px) rotateY(-14deg)}
.scene.dopen .door3d{transform:translateZ(75px) rotateY(-112deg)}
.door-front{background:linear-gradient(150deg,#5FA2A9 0%,#3D7B82 55%,#336A70 100%);border-radius:4px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),inset 0 -40px 60px rgba(0,0,0,.12);transform:translateZ(1px)}
.door-back{background:linear-gradient(#2F6167,#24494E);transform:rotateY(180deg) translateZ(1px);border-radius:4px}

<script>
/* ---------- QR Code (byte mode, ECC M, v1–10) — ดัดแปลงจากหลักการของ Nayuki (MIT) ---------- */
const QR=(()=>{
  const ECC=[0,10,16,26,18,24,16,18,22,22,26], BLK=[0,1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  const gmul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=gmul(r[j],root);if(j+1<d)r[j]^=r[j+1];}root=gmul(root,2);}return r;};
  const rsRem=(data,div)=>{const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=gmul(c,f));}return r;};
  const align=v=>{if(v===1)return[];const n=Math.floor(v/7)+2,size=v*4+17,step=Math.ceil((v*4+4)/(n*2-2))*2,res=[6];for(let p=size-7;res.length<n;p-=step)res.splice(1,0,p);return res;};
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=10;v++){if(4+(v<10?8:16)+bytes.length*8<=dataCw(v)*8)break;}
    if(v>10)throw new Error('ข้อความยาวเกินไปสำหรับ QR');
    const bits=[],push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
    push(4,4);push(bytes.length,v<10?8:16);bytes.forEach(b=>push(b,8));
    const cap=dataCw(v)*8;push(0,Math.min(4,cap-bits.length));push(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)push(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>a*2+b,0));
    // ECC + interleave
    const nb=BLK[v],el=ECC[v],rc=Math.floor(raw(v)/8),nShort=nb-rc%nb,sLen=Math.floor(rc/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sLen-el+(i<nShort?0:1));k+=d.length;const e=rsRem(d,div);if(i<nShort)d.push(0);blocks.push(d.concat(e));}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sLen-el||j>=nShort)cw.push(b[i]);});
    // matrix
    const size=v*4+17,M=[...Array(size)].map(()=>new Array(size).fill(false)),F=[...Array(size)].map(()=>new Array(size).fill(false));
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);

function promptpayPayload(id,amount){
  const t=(k,v)=>k+String(v.length).padStart(2,'0')+v, d=String(id).replace(/\D/g,'');
  let acc;
  if(d.length>=15)acc=t('03',d);
  else if(d.length>=13)acc=t('02',d);
  else acc=t('01',('0000000000000'+'66'+d.replace(/^0/,'')).slice(-13));
  let p=t('00','01')+t('01',amount?'12':'11')+t('29',t('00','A000000677010111')+acc)+t('58','TH')+t('53','764');
  if(amount)p+=t('54',Number(amount).toFixed(2));
  p+='6304';
  let crc=0xFFFF;for(const ch of p){crc^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;}
  return p+crc.toString(16).toUpperCase().padStart(4,'0');
}

function bridge(){
  if(bridgePromise)return bridgePromise;
  bridgePromise=new Promise((resolve,reject)=>{
    const f=document.createElement('iframe');
    f.src=BRIDGE;f.title='ThingsBoard';f.setAttribute('aria-hidden','true');f.tabIndex=-1;
    // ต้องอยู่ในจอ (แต่มองไม่เห็น) ไม่งั้น ThingsBoard จะไม่โหลดวิดเจ็ต
    f.style.cssText='position:fixed;right:0;bottom:0;width:320px;height:240px;border:0;opacity:0;pointer-events:none;z-index:-1';
    f._resolve=resolve;bridgeFrame=f;document.body.appendChild(f);
    setTimeout(()=>{if(f._resolve){f._resolve=null;f.remove();bridgeFrame=null;bridgePromise=null;reject(new Error('เชื่อม ThingsBoard ไม่สำเร็จ ลองรีเฟรชหน้า'));}},45000);

async function tbCall(msg){

  return new Promise(res=>{
    const id='q'+(++bridgeSeq);
    const t=setTimeout(()=>{delete pending[id];res({ok:false,msg:'ThingsBoard ไม่ตอบ ลองใหม่อีกครั้ง'});},25000);
    pending[id]=r=>{clearTimeout(t);res(r||{ok:false,msg:'ไม่มีคำตอบ'});};
    f.contentWindow.postMessage(Object.assign({camlock:1,id},msg),TB_ORIGIN);

    tbReachable=true;
    mergeTs(j.timeseries,false);mergeAttr(j.attributes||[]);applyRaw();

  finally{statusKnown=true;watchOnline();}
}

const VF={ok:['ยืนยันแล้ว','ok'],pending:['รอตรวจ','amber'],rejected:['ไม่ผ่าน','warn'],none:['ยังไม่ยืนยัน','warn'],undefined:['ยืนยันแล้ว','ok']};
const ST={await:['รอชำระเงิน','amber'],verify:['รอตรวจสอบการชำระ','amber'],ready:['พร้อมรับกล้อง','teal'],active:['กำลังเช่า','teal'],returned:['คืนแล้ว','ok'],cancelled:['ยกเลิก','grey']};
const isLate=r=>r.status==='active'&&r.due&&nowS()>r.due;
// ค่าปรับคืนช้า (นาทีละ S.lateFeeMin บาท) คำนวณสดในเครื่อง ให้ตรงกับบอร์ด
const lateNow=r=>{if(r.status!=='active'||!r.due)return 0;const over=nowS()-r.due;if(over<=(S.lateGraceMin||0)*60)return 0;return Math.ceil(over/60)*(S.lateFeeMin??100);};
const owed=r=>Math.max(0,r.amount-r.paid);
// ยอดที่ต้องจ่ายจริง: หลังคืนกล้อง ค่าปรับหักจากมัดจำก่อน ส่วนที่เกินมัดจำจึงเป็นหนี้
const debt=r=>r.status==='returned'?Math.max(0,owed(r)-r.deposit):owed(r);
const refundable=r=>r.refundable!=null?r.refundable:(r.forfeit||r.lost||r.refunded)?0:Math.max(0,Math.min(r.deposit,r.paid-(r.amount-r.deposit))); // มัดจำที่คืนได้
function statusTag(r){if(r.rf&&r.rf.st===1)return '<span class="tag amber">รอโอนเงินคืน</span>';if(r.forfeit)return '<span class="tag warn">ชำรุด · ยึดมัดจำ</span>';if(r.lost)return '<span class="tag warn">ไม่คืนกล้อง</span>';if(isLate(r))return '<span class="tag warn">เกินกำหนด</span>';if(r.status==='returned'&&r.lateFee)return '<span class="tag warn">คืนช้า</span>';const s=ST[r.status]||['-','grey'];return `<span class="tag ${s[1]}">${s[0]}</span>`;}

const PH={},phLoading={};
function getPhoto(kind,id,ver){
  if(!ver)return null;const k='ph_'+kind+id+'_'+ver;
  if(PH[k])return PH[k];
  try{const v=localStorage.getItem(k);if(v){PH[k]=v;return v;}}catch(e){}
  if(!phLoading[k]&&online!==false){phLoading[k]=1;(async()=>{
    const j=await rpc(kind==='c'?'camPhoto':'avatar',kind==='c'?{id}:{idx:id});
    if(j.ok&&j.img){PH[k]=j.img;try{Object.keys(localStorage).filter(x=>x.startsWith('ph_'+kind+id+'_')&&x!==k).forEach(x=>localStorage.removeItem(x));localStorage.setItem(k,j.img);}catch(e){}softRender();}
    else setTimeout(()=>{delete phLoading[k];},30000);})();}
  return null;}
/* รูปสินค้าตามชื่อรุ่น (ภาพสัญญาอนุญาตเสรีจาก Wikimedia Commons ต้องให้เครดิตผู้ถ่าย)
   ใช้เมื่อผู้ดูแลยังไม่ได้อัปโหลดรูปกล้องตัวจริง · เพิ่มรุ่นใหม่: ใส่ {m: คำในชื่อรุ่น, f: ชื่อไฟล์บน Commons, by, lic} */

  {m:/eos\s*r50/i,f:'Canon EOS R50 (52694437103).jpg',by:'Henry Söderlund',lic:'CC BY 2.0'},
  {m:/zv-?e10/i,f:'Sony ZV-E10 with Sony E 16-50mm F3.5-5.6 OSS PZ - by Henry Söderlund (51375243603).jpg',by:'Henry Söderlund',lic:'CC BY 2.0'},

  {m:/gopro|hero\s*1[0-3]/i,f:'GoPro Hero 8 Black and Hero 11 Black.JPG',by:'Benlisquare',lic:'CC BY-SA 4.0',note:'ภาพรุ่น HERO11 / HERO8 (ทรงเดียวกับ HERO12)'}];
const catalogOf=c=>c&&CAM_CATALOG.find(x=>x.m.test(c.name||''));

let swReg=null;
const notifyOn=()=>('Notification' in window)&&Notification.permission==='granted';
async function regSW(){try{if('serviceWorker' in navigator&&!swReg)swReg=await navigator.serviceWorker.register('sw.js');}catch(e){}}
function notify(title,body,tag){toast(title+' · '+body);if(navigator.vibrate)try{navigator.vibrate([200,100,200]);}catch(e){}
  if(!notifyOn())return;const o={body,tag,renotify:true,icon:'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230C5A5F%22/%3E%3C/svg%3E'};
  try{if(swReg&&swReg.showNotification)swReg.showNotification(title,o);else new Notification(title,o);}catch(e){}}
function checkDue(){
  const r=openRental();if(!r||r.status!=='active'||!r.due)return;
  const left=r.due-nowS(),k=s=>'cl_n_'+r.id+'_'+s,done=s=>{try{return localStorage.getItem(k(s));}catch(e){return 1;}},mark=s=>{try{localStorage.setItem(k(s),'1');}catch(e){}};
  if(left<=0){if(!done(0)){[1800,600,0].forEach(mark);notify('เกินเวลาคืนกล้องแล้ว',`${r.camName} · ปรับนาทีละ ${baht(S.lateFeeMin??100)} บาท กรุณาคืนที่ตู้โดยเร็ว`,'due'+r.id);}return;}
  if(left<=600){if(!done(600)){[1800,600].forEach(mark);notify('อีก 10 นาทีต้องคืนกล้อง',`${r.camName} · คืนก่อน ${tHM(r.due)} น.`,'due'+r.id);}return;}
  if(left<=1800&&!done(1800)){mark(1800);notify('อีก 30 นาทีต้องคืนกล้อง',`${r.camName} · คืนก่อน ${tHM(r.due)} น.`,'due'+r.id);}
}
function dueBar(){const r=openRental();if(!r||r.status!=='active')return '';const left=r.due-nowS();
  if(left>1800)return '';
  return `<div class="duebar">${ic('clock')}<div style="flex:1"><b>${left<=0?'เกินเวลาคืนแล้ว '+dur(-left):'ใกล้ถึงเวลาคืน · เหลือ '+dur(left)}</b><div class="xs">${left<=0?`ค่าปรับตอนนี้ ${baht(lateNow(r))} ฿ (นาทีละ ${baht(S.lateFeeMin??100)} ฿)`:`คืนก่อน ${tHM(r.due)} น. ไม่งั้นปรับนาทีละ ${baht(S.lateFeeMin??100)} ฿`}</div></div><button class="btn sm" data-go="active">ดู</button></div>`;}

function fmtPP(id){id=String(id||'');return id.length===10?id.replace(/^(\d{3})(\d{3})(\d{4})$/,'$1-$2-$3'):id.length===13?id.replace(/^(\d)(\d{4})(\d{5})(\d{2})(\d)$/,'$1-$2-$3-$4-$5'):id;}
function walletPayBlock(r){
  const due=debt(r);if(due<=0||me.test)return '';

       :`<button class="btn ghost" style="margin-top:10px" data-go="wallet">เงินไม่พอ · เติมเงินเข้ากระเป๋า</button>`}</div>

// หน้าเปิดตู้ (ติดตามสถานะจริงจากตู้)
/* ---------- หน้าเปิดตู้: โมเดล 3 มิติจำลองตู้จริง ----------
   สร้างฉากครั้งเดียว แล้วอัปเดตแค่ class/ข้อความ เพื่อให้แอนิเมชันประตูลื่น */
function box3d(w,h,d,cls,faces={}){
  const F=(n,fw,fh,tr)=>`<div class="fc ${cls}-${n}" style="width:${fw}px;height:${fh}px;margin:${-fh/2}px 0 0 ${-fw/2}px;transform:${tr}">${faces[n]||''}</div>`;
  return F('front',w,h,`translateZ(${d/2}px)`)+F('back',w,h,`rotateY(180deg) translateZ(${d/2}px)`)+
    F('left',d,h,`rotateY(-90deg) translateZ(${w/2}px)`)+F('right',d,h,`rotateY(90deg) translateZ(${w/2}px)`)+
    F('top',w,d,`rotateX(90deg) translateZ(${h/2}px)`)+F('bottom',w,d,`rotateX(-90deg) translateZ(${h/2}px)`);
}
function lockerScene(){

    <div class="fc cab-side" style="width:${D}px;height:${H}px;margin:${-H/2}px 0 0 ${-D/2}px;transform:rotateY(90deg) translateZ(${W/2}px)">${pcb}</div>

    <div class="fc cab-bottom" style="width:${W}px;height:${D}px;margin:${-D/2}px 0 0 ${-W/2}px;transform:rotateX(-90deg) translateZ(${H/2}px)"></div>
    <div class="fc cab-shelf" style="width:${W-6}px;height:${D-6}px;margin:${-(D-6)/2}px 0 0 ${-(W-6)/2}px;transform:rotateX(-90deg) translateZ(28px)"></div>

function updateOpen(){
  const f=ui.openFlow, sc=$('#scene3d');if(!f||!sc)return;
  const ret=f.action==='return';
  const unlocking=S.unlocking, isOpen=S.door==='open';
  if(isOpen&&!f.sawOpen){f.sawOpen=true;f.openAt=Date.now();}
  if(f.sawOpen&&!isOpen&&!unlocking)f.closed=true;
  const since=f.openAt?Date.now()-f.openAt:0;
  // กล้อง: รับ = อยู่ในตู้แล้วถูกหยิบออก / คืน = ถูกใส่เข้าไป
  const camIn=ret?(f.closed||(f.sawOpen&&since>2500)):!(f.closed||(f.sawOpen&&since>3500));
  sc.classList.toggle('unlocked',!!unlocking);
  sc.classList.toggle('dopen',isOpen&&!f.closed);
  sc.classList.toggle('ajar',!!unlocking&&!isOpen);
  sc.classList.toggle('has-cam',camIn);
  sc.classList.toggle('online',online);
  const left=Math.max(0,Math.ceil((f.ms-(Date.now()-f.t))/1000));
  $('#cap3d').innerHTML=f.closed?`${ic('lock')} ประตูปิด · ล็อกแล้ว`:unlocking?`${ic('unlock')} ปลดล็อกอยู่ · ล็อกเองใน ${left} วิ`:isOpen?`${ic('door')} ประตูเปิด`:`${ic('lock')} ล็อกอยู่`;
  const step=(state,txt)=>`<div class="s ${state}"><span class="m">${state==='done'?'✓':state==='now'?'›':'·'}</span><span>${txt}</span></div>`;
  const r=myRentals.find(x=>x.id==f.rid);
  const hasPhoto=!!(f.photo||(r&&(ret?r.photoRet:r.photoPick)));
  const lines=[
    step('done',`ส่งคำสั่ง → ThingsBoard → ${esc(S.locker?S.locker.name:'ตู้')} (#${f.rid})`),
    step('done','ESP32 ตรวจสิทธิ์ผ่าน → GPIO26 = HIGH → รีเลย์ทำงาน'),
    step(unlocking?'now':'done',unlocking?`กลอนเปิดค้าง (ล็อกเองใน <b class="cd"></b> วินาที)`:'กลอน → <b>ล็อกแล้ว</b>'),
    S.reed===false
      ?step(f.sawOpen?'done':'now',f.sawOpen?'ประตู<b>ปลดล็อกแล้ว</b> ดึงเปิดได้เลย':'รอตู้ตอบรับ…')
      :step(f.sawOpen?'done':'now',f.sawOpen?'reed switch → <b>ประตูเปิดแล้ว</b>':'รอดึงประตูเปิด…'),
    step(hasPhoto?'done':(f.sawOpen?'now':'wait'),hasPhoto?'รูปหลักฐาน → <b>บันทึกแล้ว</b>':(ret?'ใส่กล้องเข้าตู้ แล้วถ่ายรูปหลักฐาน':'หยิบกล้องออก แล้วถ่ายรูปหลักฐาน')),
    step(f.closed?'done':(hasPhoto?'now':'wait'),f.closed?'ประตูปิด → <b>ล็อกแล้ว</b>':'ปิดประตู แล้วกด “ล็อกตู้”'),
  ];
  let after='';
  if(f.closed){
    if(ret){const done=r&&r.status==='returned';
      after=done?`<div class="alert ok">${ic('check')}<div><b>คืนกล้องเรียบร้อย ขอบคุณครับ</b><br>${r.lateFee?`คืนช้า ค่าปรับ ${baht(r.lateFee)} ฿ หักจากมัดจำ`:'คืนตรงเวลา'} · มัดจำ ${baht(refundable(r))} ฿ จะโอนคืนเข้าบัญชีธนาคารหลังผู้ดูแลตรวจสภาพ${hasBank(BANK)||me.test?'':' · <b>อย่าลืมกรอกบัญชีรับเงินคืนในหน้าบัญชี</b>'}</div></div>`
        :`<div class="card row"><div class="spin"></div><div>กำลังบันทึกการคืน…</div></div>`;
    }else after=`<div class="alert ok">${ic('check')}<div><b>รับกล้องเรียบร้อย</b><br>คืนก่อน ${r?tFull(r.due):'-'}</div></div>`;
  }else if(!unlocking&&!f.sawOpen&&Date.now()-f.t>f.ms+1500){
    after=`<div class="alert amber">${ic('info')}<div>กลอนล็อกกลับแล้วแต่ประตูยังไม่ถูกเปิด กดปลดล็อกอีกครั้งได้</div></div>
      <button class="btn ghost" data-act="reopen" data-rid="${f.rid}">${ic('unlock')} ปลดล็อกอีกครั้ง</button>`;
  }
  const evCard=(f.sawOpen||f.closed)?`<div class="card evcard"><div class="row"><div class="ic ${hasPhoto?'ok':'amber'}" style="width:42px;height:42px;border-radius:13px;display:grid;place-items:center">${ic(hasPhoto?'check':'cam')}</div>
      <div class="grow"><b>รูปหลักฐาน${ret?'การคืน':'การรับ'}</b><div class="xs muted">${ret?'ถ่ายให้เห็นกล้องวางในตู้ ครบอุปกรณ์':'ถ่ายกล้องที่หยิบออกมา ให้เห็นสภาพก่อนใช้'}</div></div>
      <button class="btn sm ${hasPhoto?'ghost':''}" data-act="pickPhoto" data-ev="${ret?'return':'pickup'}" data-rid="${f.rid}" data-cap="environment">${hasPhoto?'ถ่ายใหม่':'ถ่ายรูป'}</button></div>
      ${f.photo?`<img class="vthumb" src="${f.photo}" alt="">`:''}</div>`:'';
  const html=`<div class="term">${lines.join('')}</div>${evCard}${after}
    ${!f.closed&&(unlocking||isOpen)?`<button class="btn amber" data-act="lockNow" ${hasPhoto?'':'disabled'}>${ic('lock')} ${ret?'ใส่กล้องแล้ว':'หยิบกล้องแล้ว'} ล็อกตู้</button>
      ${hasPhoto?'':`<p class="xs muted center" style="margin:8px 0 0">ถ่ายรูปหลักฐานก่อนจึงกดล็อกได้ · ถ้าไม่กด ตู้จะล็อกเองใน <b class="cd"></b> วินาที</p>`}`:''}
    ${f.closed?`<button class="btn" data-act="closeOpen">${ret?'กลับหน้าแรก':'ดูเวลาที่เหลือ'}</button>`:''}`;
  const dyn=$('#openDyn');if(dyn.dataset.h!==html){dyn.innerHTML=html;dyn.dataset.h=html;}
  dyn.querySelectorAll('.cd').forEach(el=>el.textContent=left);
}
AFTER.open=()=>{
  updateOpen();
  const st=$('#stage3d'),sc=$('#scene3d');if(!st)return;
  let rx=-14,ry=-32,drag=null;
  const apply=()=>{sc.style.transform=`scale(.86) rotateX(${rx}deg) rotateY(${ry}deg)`;};apply();
  st.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,rx,ry};st.setPointerCapture(e.pointerId);st.classList.add('drag');};
  st.onpointermove=e=>{if(!drag)return;ry=drag.ry+(e.clientX-drag.x)*0.5;rx=Math.max(-50,Math.min(20,drag.rx-(e.clientY-drag.y)*0.3));apply();};
  st.onpointerup=st.onpointercancel=()=>{drag=null;st.classList.remove('drag');};
};

// ย่อรูปให้เล็กพอส่งผ่าน ThingsBoard (< 19KB)
function shrinkImage(file,limit=19000){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  let max=520,q=.7,out='';
  for(let i=0;i<8;i++){const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<limit)break;q=Math.max(.35,q-.1);max=Math.round(max*.82);}
  URL.revokeObjectURL(img.src);out.length<limit+500?res(out):rej(new Error('รูปใหญ่เกินไป'));};img.onerror=()=>rej(new Error('อ่านรูปไม่ได้'));img.src=URL.createObjectURL(file);});}
// ---------- อ่าน QR บนสลิป (BarcodeDetector ถ้ามี ไม่งั้นโหลด jsQR) ----------
let _jsqr=null;
function loadJsQR(){return _jsqr||(_jsqr=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
  sc.onload=()=>res(window.jsQR);sc.onerror=()=>{_jsqr=null;rej(new Error('โหลดตัวอ่าน QR ไม่ได้ ตรวจอินเทอร์เน็ต'));};document.head.appendChild(sc);}));}
function loadImg(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('อ่านรูปไม่ได้'));img.src=URL.createObjectURL(file);});}
async function readSlipQR(file){
  const img=await loadImg(file);
  try{
    if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(img);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue;}catch(e){}}
    const jsQR=await loadJsQR();
    const W=img.naturalWidth,H=img.naturalHeight;
    // ลองหลายขนาด และลองครอปครึ่งล่าง (QR ของสลิปส่วนใหญ่อยู่ล่าง)
    const tries=[[0,0,1,1,1200],[0,0,1,1,800],[0,0,1,1,1800],[0,.4,1,.6,1200],[.35,.4,.65,.6,900]];
    for(const [x,y,w,h,max] of tries){
      const sw=W*w,sh=H*h,sc=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(sw*sc));c.height=Math.max(1,Math.round(sh*sc));
      const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,W*x,H*y,sw,sh,0,0,c.width,c.height);
      const d=g.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(r&&r.data)return r.data;
    }
    return null;
  }finally{URL.revokeObjectURL(img.src);}
}

/* ---------- ถอนเงินที่เติมไว้ในกระเป๋า เข้าบัญชีธนาคาร ----------
   เงินถูกกันไว้ทันที ผู้ดูแลโอนให้แล้วกด "โอนแล้ว" (ปฏิเสธ = เงินกลับเข้ากระเป๋า) */
/* ---------- บัญชีธนาคารสำหรับรับเงินคืน ----------
   ค่ามัดจำ/เงินจากรายการที่ยกเลิก โอนคืนเข้าบัญชีธนาคารนี้โดยตรง (ไม่เข้ากระเป๋าเว็บ)
   ต้องตรงกับตาราง BANKS ในเฟิร์มแวร์ (รหัส, ชื่อ, จำนวนหลัก) */
const BANKS=[['KBANK','กสิกรไทย',10,10],['SCB','ไทยพาณิชย์',10,10],['BBL','กรุงเทพ',10,10],['KTB','กรุงไทย',10,10],['BAY','กรุงศรีอยุธยา',10,10],
  ['TTB','ทหารไทยธนชาต (ttb)',10,10],['GSB','ออมสิน',12,12],['BAAC','ธ.ก.ส.',12,12],['GHB','อาคารสงเคราะห์',12,12],['UOB','ยูโอบี',10,10],
  ['CIMB','ซีไอเอ็มบี ไทย',10,10],['KKP','เกียรตินาคินภัทร',10,10],['LHB','แลนด์ แอนด์ เฮ้าส์',10,10],['TISCO','ทิสโก้',10,10],['ICBC','ไอซีบีซี (ไทย)',10,10],
  ['PP','พร้อมเพย์',10,13],['OTHER','ธนาคารอื่น',8,15]];
const bankDef=c=>BANKS.find(b=>b[0]===c);
const bankName=c=>{const b=bankDef(c);return b?b[1]:(c||'-');};
const hasBank=b=>!!(b&&b.code&&b.acct&&b.holder);
function fmtAcct(code,a){a=String(a||'');if(code==='PP')return fmtPP(a);if(a.length===10)return a.replace(/^(\d{3})(\d)(\d{5})(\d)$/,'$1-$2-$3-$4');if(a.length===12)return a.replace(/^(\d{3})(\d{3})(\d{6})$/,'$1-$2-$3');return a;}
const bankLine=b=>hasBank(b)?`${esc(bankName(b.code))} <b class="mono">${esc(fmtAcct(b.code,b.acct))}</b> · ${esc(b.holder)}`:'<i>ยังไม่ได้กรอกบัญชี</i>';
// ตรวจเลขบัญชีฝั่งเว็บ (เฟิร์มแวร์ตรวจซ้ำอีกชั้น) คืนข้อความผิดพลาด หรือ ''
function bankErr(code,acct,holder){const b=bankDef(code);acct=String(acct||'').replace(/\D/g,'');
  if(!b)return 'เลือกธนาคาร';
  if(code==='PP'){if(acct.length!==10&&acct.length!==13)return 'พร้อมเพย์ต้องเป็นเบอร์โทร 10 หลัก หรือเลขบัตรประชาชน 13 หลัก';if(acct.length===10&&acct[0]!=='0')return 'เบอร์โทรพร้อมเพย์ต้องขึ้นต้นด้วย 0';}
  else if(acct.length<b[2]||acct.length>b[3])return `เลขบัญชี${b[1]} ต้องมี ${b[2]===b[3]?b[2]:b[2]+'-'+b[3]} หลัก (ตอนนี้ ${acct.length} หลัก)`;
  if(String(holder||'').trim().length<4)return 'ใส่ชื่อ-นามสกุลเจ้าของบัญชีให้ครบ';
  return '';}
// กล่องสถานะการคืนเงินของรายการ (ฝั่งผู้ใช้)
function refundNote(r){
  if(!r||me&&me.test)return '';
  const rf=r.rf||{st:0};
  if(r.forfeit)return `<div class="alert warn" style="margin:10px 0 0">${ic('alert')}<div>ผู้ดูแลตรวจแล้วพบว่ากล้องชำรุด/เสียหาย <b>ไม่คืนมัดจำ</b></div></div>`;
  if(r.lost)return `<div class="alert warn" style="margin:10px 0 0">${ic('alert')}<div>ไม่คืนกล้องภายในเวลาที่กำหนด <b>ไม่คืนมัดจำ</b></div></div>`;
  const what=r.status==='cancelled'?'เงินที่จ่ายแล้ว':'ค่ามัดจำ';
  const need=!hasBank(BANK)?`<button class="btn sm amber" style="margin-top:8px" data-act="bankSheet">${ic('wallet')} กรอกบัญชีธนาคารเพื่อรับเงินคืน</button>`:'';
  if(rf.st===2)return `<div class="alert ok" style="margin:10px 0 0">${ic('check')}<div><b>โอน${what}คืน ${baht(rf.amount)} ฿ แล้ว</b><div class="xs">${hasBank(rf.to)?'เข้า '+bankLine(rf.to):esc(rf.ref||'')}${rf.doneAt?' · '+tFull(rf.doneAt):''}${rf.ref&&hasBank(rf.to)?' · อ้างอิง '+esc(rf.ref):''}</div></div></div>`;
  if(rf.st===1)return `<div class="alert teal" style="margin:10px 0 0">${ic('clock')}<div style="flex:1"><b>รอผู้ดูแลโอน${what}คืน ${baht(rf.amount)} ฿</b><div class="xs">เข้าบัญชี ${bankLine(BANK)}</div>${need||`<button class="link xs" data-act="bankSheet">แก้ไขบัญชี</button>`}</div></div>`;
  if(r.status==='returned'&&!r.refunded&&r.deposit)return `<div class="alert teal" style="margin:10px 0 0">${ic('wallet')}<div style="flex:1">มัดจำ ${baht(refundable(r))} ฿ รอผู้ดูแลตรวจสภาพกล้อง แล้วจะ<b>โอนคืนเข้าบัญชีธนาคาร</b>ของคุณ<div class="xs">${bankLine(BANK)}</div>${need}</div></div>`;
  if(r.status==='returned'&&r.refunded&&r.deposit&&!rf.st)return `<div class="alert ok" style="margin:10px 0 0">${ic('check')}<div>ตรวจสภาพผ่าน ปิดรายการแล้ว</div></div>`;
  return '';}
function wdStatus(){const w=WAL.wd||{st:0};

function adminRentalCard(r){
  const late=isLate(r), due=debt(r);

  if(['await','verify','ready'].includes(r.status))acts.push(`<button class="btn sm danger" data-act="aRent" data-a="cancel" data-rid="${r.id}">ยกเลิก</button>`);
  if(r.status==='active'){if(due>0&&!r.notified)acts.push(`<button class="btn sm ghost" data-act="aRent" data-a="confirm" data-rid="${r.id}">รับยอดค้าง ${baht(due)} ฿</button>`);acts.push(`<button class="btn sm ghost" data-act="aRent" data-a="returned" data-rid="${r.id}">รับคืนเอง</button>`);
    if(late&&!r.lost&&r.deposit)acts.push(`<button class="btn sm danger" data-act="aRent" data-a="lost" data-rid="${r.id}">ไม่คืนกล้อง · ยึดมัดจำ</button>`);}
  if(r.status==='returned'){if(due>0&&!r.refunded)acts.push(`<button class="btn sm ghost" data-act="aRent" data-a="confirm" data-rid="${r.id}">รับยอดค้าง ${baht(due)} ฿ เป็นเงินสด</button>`);
    if(!r.refunded&&r.deposit&&!(r.rf&&r.rf.st===1)){acts.push(`<button class="btn sm" data-act="aRent" data-a="refund" data-rid="${r.id}">${ic('check')} ตรวจผ่าน · อนุมัติคืนมัดจำ ${baht(refundable(r))} ฿</button>`);
      if(!r.lost)acts.push(`<button class="btn sm danger" data-act="aRent" data-a="forfeit" data-rid="${r.id}">ชำรุด/เสียหาย · ไม่คืนมัดจำ</button>`);}}

    <div class="meta">${r.status==='active'?`ต้องคืน ${tFull(r.due)}${late?' · <b style="color:var(--warn)">เกิน '+dur(nowS()-r.due)+'</b>':''}`:r.status==='returned'?`คืนเมื่อ ${tFull(r.returned)}`:`จองเมื่อ ${tFull(r.created)}`}</div>

const COL={brand:'#0C5A5F',brand2:'#2E8F96',accent:'#E08A1E',ok:'#157A52',warn:'#B4410F',mute:'#C9D6D9',blue:'#3B7DD8',violet:'#7C5CC4'};
// กราฟแท่งแบบ HTML (คมชัดทุกขนาดจอ)
function svgBars(data,{h=130,color=COL.brand,hl=-1,fmt=v=>v}={}){
  const max=Math.max(1,...data.map(d=>d.v)),every=data.length>16?2:1;
  return `<div class="hbars" style="height:${h}px">${data.map((d,i)=>`<div class="hbc" title="${esc(d.l)}: ${esc(fmt(d.v))}">
      <span class="hbv">${d.v&&(data.length<=14||d.v===max)?esc(fmt(d.v)):''}</span>
      <i style="height:${d.v?Math.max(3,d.v/max*100):0}%;background:${i===hl?COL.accent:color}"></i>
      <span class="hbl">${i%every===0?esc(d.l):''}</span></div>`).join('')}</div>`;
}
function svgLine(data,{h=110,color=COL.brand2}={}){
  const max=Math.max(1,...data.map(d=>d.v)),W=300,step=W/Math.max(1,data.length-1);
  const pts=data.map((d,i)=>[i*step,h-(d.v/max)*h*.85-4]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="chart line" style="height:${h}px" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none"><path d="${path} L${W} ${h} L0 ${h} Z" fill="${color}" opacity=".12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="lnl"><span>${esc(data[0].l)}</span><span>สูงสุด ${Math.max(...data.map(d=>d.v))}/วัน</span><span>${esc(data[data.length-1].l)}</span></div>`;
}
function svgDonut(segs,center,sub){
  const tot=segs.reduce((a,s)=>a+s.v,0)||1,R=52,C=2*Math.PI*R;let off=0;
  return `<div class="donut"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#EEF3F4" stroke-width="18"/>
    ${segs.filter(s=>s.v).map(s=>{const len=s.v/tot*C;const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(s.l)}: ${s.v}</title></circle>`;off+=len;return el;}).join('')}
    <text x="70" y="68" text-anchor="middle" class="dn-v">${esc(center)}</text><text x="70" y="86" text-anchor="middle" class="dn-s">${esc(sub)}</text></svg>
    <div class="legend">${segs.map(s=>`<div><i style="background:${s.c}"></i>${esc(s.l)}<b>${s.v}</b></div>`).join('')}</div></div>`;
}
function hbars(list,color=COL.brand){
  const max=Math.max(1,...list.map(x=>x.v));
  return list.map(x=>`<div class="hb"><div class="hb-l"><span>${esc(x.l)}</span><b>${esc(x.s??x.v)}</b></div><div class="hb-t"><i style="width:${x.v/max*100}%;background:${x.c||color}"></i></div></div>`).join('')||'<div class="empty sm">ยังไม่มีข้อมูล</div>';
}
function kpi(label,value,sub,icon,tone='teal',go=''){
  return `<div class="kpi ${go?'clk':''}" ${go?`data-go="${go}"`:''}><div class="kpi-h"><span>${label}</span><i class="ic ${tone}">${ic(icon)}</i></div><div class="kpi-v">${value}</div><div class="kpi-s">${sub}</div></div>`;
}
function dayKey(t){return new Date(t*1000).toLocaleDateString('en-CA',TZ);}
function dashStats(){
  const R=AD.rentals, now=nowS(), today=dayKey(now), month=today.slice(0,7);
  const earned=R.filter(r=>['ready','active','returned'].includes(r.status));
  const income=r=>Math.max(0,r.amount-r.deposit);
  const when=r=>r.picked||r.created;
  const days=[];for(let i=13;i>=0;i--){const t=now-i*86400;days.push({k:dayKey(t),l:new Date(t*1000).toLocaleDateString('th-TH',Object.assign({day:'numeric'},TZ)),v:0,n:0});}
  earned.forEach(r=>{const d=days.find(x=>x.k===dayKey(when(r)));if(d){d.v+=income(r);d.n++;}});
  const hours=Array.from({length:24},(_,i)=>({l:String(i),v:0}));
  R.filter(r=>r.picked).forEach(r=>{const hh=Number(new Date(r.picked*1000).toLocaleString('en-US',Object.assign({hour:'numeric',hour12:false},TZ)))%24;hours[hh].v++;});
  const camCount={};earned.forEach(r=>{camCount[r.camName]=(camCount[r.camName]||0)+1;});
  const userCount={};earned.forEach(r=>{const k=r.uname+' ('+r.sid+')';userCount[k]=(userCount[k]||{v:0,h:0});userCount[k].v++;userCount[k].h+=r.hours;});
  const byStatus=s=>R.filter(r=>r.status===s).length;
  const active=R.filter(r=>r.status==='active');
  const returned=R.filter(r=>r.status==='returned');
  const onTime=returned.filter(r=>!r.lateFee).length;
  return{
    todayIncome:earned.filter(r=>dayKey(when(r))===today).reduce((a,r)=>a+income(r),0),
    monthIncome:earned.filter(r=>dayKey(when(r)).startsWith(month)).reduce((a,r)=>a+income(r),0),
    totalIncome:earned.reduce((a,r)=>a+income(r),0),
    todayCount:earned.filter(r=>dayKey(when(r))===today).length,
    deposits:R.filter(r=>['ready','active'].includes(r.status)||(r.status==='returned'&&!r.refunded)).reduce((a,r)=>a+(r.rf&&r.rf.st===1?r.rf.amount:r.deposit),0),
    owedTotal:R.filter(r=>r.status!=='cancelled').reduce((a,r)=>a+debt(r),0),
    days,hours,active,late:active.filter(isLate),
    verify:R.filter(r=>r.status==='verify'||(r.notified&&owed(r)>0)),ready:R.filter(r=>r.status==='ready'),
    refunds:returned.filter(r=>!r.refunded&&r.deposit&&!(r.rf&&r.rf.st===1)),
    rfWait:R.filter(r=>r.rf&&r.rf.st===1),
    cams:Object.entries(camCount).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v).slice(0,6),
    users:Object.entries(userCount).map(([l,o])=>({l,v:o.v,s:o.v+' ครั้ง · '+o.h+' ชม.'})).sort((a,b)=>b.v-a.v).slice(0,5),
    status:[{l:'กำลังเช่า',v:byStatus('active'),c:COL.brand},{l:'รอรับ',v:byStatus('ready'),c:COL.brand2},{l:'รอชำระ/ตรวจ',v:byStatus('await')+byStatus('verify'),c:COL.accent},{l:'คืนแล้ว',v:returned.length,c:COL.ok},{l:'ยกเลิก',v:byStatus('cancelled'),c:COL.mute}],
    onTimePct:returned.length?Math.round(onTime/returned.length*100):100,
    avgHours:earned.length?Math.round(earned.reduce((a,r)=>a+r.hours,0)/earned.length*10)/10:0,
    total:R.length
  };
}

ACT.saveQR=async d=>{const svg=$('#payQR svg');if(!svg)return;try{
  const x=new XMLSerializer().serializeToString(svg).replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"').replace(/^(<svg[^>]*xmlns="http:\/\/www.w3.org\/2000\/svg"[^>]*) xmlns="http:\/\/www.w3.org\/2000\/svg"/,'$1');
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x);await img.decode();
  const c=document.createElement('canvas');c.width=720;c.height=880;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,720,880);
  g.fillStyle='#0F3A68';g.font='bold 40px sans-serif';g.textAlign='center';g.fillText('PromptPay',360,70);g.drawImage(img,110,100,500,500);
  g.fillStyle='#0C5A5F';g.font='bold 46px sans-serif';g.fillText(baht(+d.amt)+'.00 บาท',360,680);
  g.fillStyle='#333';g.font='28px sans-serif';g.fillText(S.ppName||'',360,740);g.fillText('พร้อมเพย์ '+fmtPP(S.promptpay),360,785);
  const a=document.createElement('a');a.download='camlock-promptpay-'+d.amt+'.png';a.href=c.toDataURL('image/png');a.click();toast('บันทึกรูป QR แล้ว');
}catch(e){toast('บันทึกรูปไม่ได้ ลองแคปหน้าจอแทน');}};

ACT.cancelRental=async d=>{if(!await confirmBox('ยกเลิกการจอง?','กล้องจะถูกปล่อยให้คนอื่นเช่า ถ้าโอนเงินไปแล้ว ผู้ดูแลจะคืนเงินให้','ยกเลิกการจอง',true))return;

ACT.openFlow=async(d,b)=>{

};

ACT.saveCam=async d=>{const j=await rpc('adminCamera',{id:d.id,name:$('#cName').value,imgUrl:($('#cUrl')||{}).value||'',lens:$('#cLens').value,specs:$('#cSpecs').value,price:$('#cPrice').value,deposit:$('#cDep').value,status:$('#cStatus').value});

ACT.wdSheet=()=>{if(WAL.bal<1){toast('ไม่มีเงินในกระเป๋าให้ถอน');return;}
  if(!hasBank(BANK)){toast('กรอกบัญชีธนาคารที่จะรับเงินก่อน');ACT.bankSheet();return;}
  const busy=myRentals.some(r=>r.status==='active');
  sheet(`<h2>ถอนเงินเข้าบัญชี</h2><p class="sm muted" style="margin:4px 0 12px">ยอดที่ถอนได้ ${baht(WAL.bal)} ฿ · ผู้ดูแลจะโอนเข้าบัญชีของคุณ</p>
    ${busy?`<div class="alert warn">${ic('alert')}<div>ยังมีกล้องที่เช่าอยู่ คืนกล้องก่อนจึงจะถอนได้</div></div>`:''}
    <div class="card" style="margin:0 0 10px"><div class="xs muted">โอนเข้า</div><div class="sm">${bankLine(BANK)}</div><button class="link xs" data-act="bankSheet">เปลี่ยนบัญชี</button></div>

ACT.wdSend=async()=>{const amt=Math.trunc(Number(($('#wdAmt')||{}).value||0));
  if(!(amt>=1&&amt<=WAL.bal)){toast('จำนวนเงินต้องอยู่ระหว่าง 1 – '+baht(WAL.bal)+' บาท');return;}
  if(!await confirmBox(`ถอน ${baht(amt)} บาท?`,`โอนเข้า ${bankLine(BANK)}`,'ส่งคำขอ'))return;
  const j=await rpc('withdraw',{amount:amt});toast(j.msg);
  if(j.ok){WAL.bal=j.wallet;WAL.wd=j.withdraw;closeSheet();await loadMe();softRender();}};
ACT.wdCancel=async()=>{if(!await confirmBox('ยกเลิกคำขอถอนเงิน?','เงินจะกลับเข้ากระเป๋า','ยกเลิกคำขอ'))return;
  const j=await rpc('withdrawCancel');toast(j.msg);if(j.ok){WAL.bal=j.wallet;WAL.wd=j.withdraw;softRender();}};
ACT.aWd=async d=>{const x=WDS.find(v=>String(v.u)===String(d.u));if(!x)return;
  const paid=d.a==='paid';
  if(!await confirmBox(paid?`ยืนยันว่าโอน ${baht(x.w.amount)} บาทแล้ว?`:`ปฏิเสธคำขอ ${baht(x.w.amount)} บาท?`,paid?`เข้า ${bankLine(x.w.to||{})}`:'เงินจะกลับเข้ากระเป๋าของสมาชิก',paid?'โอนแล้ว':'ปฏิเสธ',!paid))return;
  const note=paid?'':(prompt('เหตุผล (แสดงให้ผู้ใช้เห็น)','เลขพร้อมเพย์ไม่ถูกต้อง')||'');
  const j=await rpc('adminWithdraw',{u:x.u,action:d.a,note});toast(j.msg);if(j.ok){const w=await rpc('adminWithdrawals');if(w.ok)WDS=w.items||[];await loadAdmin();softRender();}};
ACT.bankSheet=()=>{const b=BANK||{};
  sheet(`<h2>บัญชีรับเงินคืน</h2><p class="sm muted" style="margin:4px 0 12px">ค่ามัดจำ และเงินจากรายการที่ยกเลิก จะโอนคืนเข้าบัญชีนี้โดยตรง ตรวจให้ถูกต้องก่อนบันทึก</p>
    <label class="lb">ธนาคาร</label><select class="inp" id="bkCode" data-act-input="bankCheck"><option value="">— เลือกธนาคาร —</option>${BANKS.map(x=>`<option value="${x[0]}" ${b.code===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>
    <label class="lb" id="bkAcctLb">เลขที่บัญชี</label><input class="inp mono" id="bkAcct" inputmode="numeric" maxlength="20" autocomplete="off" value="${esc(b.acct||'')}" placeholder="ตัวเลขเท่านั้น" data-act-input="bankCheck">
    <label class="lb">ยืนยันเลขที่บัญชีอีกครั้ง</label><input class="inp mono" id="bkAcct2" inputmode="numeric" maxlength="20" autocomplete="off" value="${esc(b.acct||'')}" data-act-input="bankCheck">
    <label class="lb">ชื่อ-นามสกุล เจ้าของบัญชี (ตรงกับสมุดบัญชี)</label><input class="inp" id="bkHolder" maxlength="39" value="${esc(b.holder||me.name||'')}" data-act-input="bankCheck">
    <div class="xs" id="bkMsg" style="min-height:18px;margin:-2px 0 8px"></div>
    <button class="btn" data-act="bankSave">บันทึกบัญชี</button>${hasBank(b)?`<button class="btn ghost danger" data-act="bankDel">ลบบัญชี</button>`:''}<button class="btn ghost" data-act="closeSheet">ยกเลิก</button>`);
  ACT.bankCheck();};
ACT.bankCheck=()=>{const c=($('#bkCode')||{}).value,a=(($('#bkAcct')||{}).value||''),a2=(($('#bkAcct2')||{}).value||''),h=(($('#bkHolder')||{}).value||''),m=$('#bkMsg');if(!m)return '';
  const d=bankDef(c),lb=$('#bkAcctLb');if(lb)lb.textContent=c==='PP'?'เบอร์โทร (10 หลัก) หรือเลขบัตรประชาชน (13 หลัก)':d?`เลขที่บัญชี (${d[2]===d[3]?d[2]:d[2]+'-'+d[3]} หลัก)`:'เลขที่บัญชี';
  const da=a.replace(/\D/g,''),da2=a2.replace(/\D/g,'');
  let e=a!==''&&/[^\d\s-]/.test(a)?'เลขบัญชีใส่ได้แค่ตัวเลข':bankErr(c,da,h);
  if(!e&&da!==da2)e='เลขบัญชีสองช่องไม่ตรงกัน';
  m.textContent=e?e:'✓ '+bankName(c)+' '+fmtAcct(c,da)+' · '+h.trim();m.style.color=e?'var(--warn)':'var(--ok,#16a34a)';return e;};
ACT.bankSave=async()=>{const e=ACT.bankCheck();if(e){toast(e);return;}
  const code=$('#bkCode').value,acct=$('#bkAcct').value.replace(/\D/g,''),holder=$('#bkHolder').value.trim();
  if(!await confirmBox('ยืนยันบัญชีนี้?',`${esc(bankName(code))} <b class="mono">${esc(fmtAcct(code,acct))}</b><br>${esc(holder)}<br><span class="xs">ถ้าเลขผิด เงินอาจโอนไปผิดบัญชี</span>`,'บันทึก'))return;
  const j=await rpc('bankSave',{code,acct,holder});toast(j.msg);
  if(j.ok){BANK=j.bank||{code,acct,holder};closeSheet();await loadMe();softRender();}else ACT.bankSheet();};
ACT.bankDel=async()=>{if(!await confirmBox('ลบบัญชีรับเงินคืน?','ต้องกรอกใหม่ก่อนรับมัดจำคืนครั้งถัดไป','ลบ',true))return;
  const j=await rpc('bankSave',{code:'',acct:'',holder:''});toast(j.msg);if(j.ok){BANK={code:'',acct:'',holder:''};softRender();}};
ACT.copyTxt=d=>{const v=String(d.v||'');(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('คัดลอกแล้ว '+v)).catch(()=>toast(v));};
ACT.aRefundPaid=d=>{const r=AD.rentals.find(x=>String(x.id)===String(d.rid));if(!r||!r.rf)return;const b=r.rf.to||{},ok=hasBank(b);
  sheet(`<h2>โอน${r.status==='cancelled'?'เงิน':'ค่ามัดจำ'}คืนแล้ว?</h2><p class="sm muted" style="margin:4px 0 12px">#${r.id} ${esc(r.camName)} · ${esc(r.uname)}</p>
    <div class="mono" style="font-size:24px;font-weight:600;color:var(--brand)">${baht(r.rf.amount)} ฿</div>
    <div class="sm" style="margin:4px 0 12px">${ok?'เข้า '+bankLine(b):'<b style="color:var(--warn)">ผู้เช่ายังไม่กรอกบัญชี</b> ต้องใส่หมายเหตุว่าคืนเงินทางไหน'}</div>
    <label class="lb">${ok?'เลขอ้างอิงการโอน / หมายเหตุ (ไม่บังคับ)':'หมายเหตุ (จำเป็น) เช่น คืนเงินสดแล้ว'}</label><input class="inp" id="rfRef" maxlength="31" placeholder="${ok?'เช่น เลขที่รายการจากสลิป':'คืนเงินสดที่ห้อง ...'}">
    <p class="xs muted">กดยืนยันหลังจากโอนเงินเรียบร้อยแล้วเท่านั้น ผู้เช่าจะเห็นว่าโอนคืนแล้ว</p>
    <button class="btn" data-act="aRefundPaidGo" data-rid="${r.id}">${ic('check')} ยืนยัน โอนคืนแล้ว</button><button class="btn ghost" data-act="closeSheet">ยกเลิก</button>`);};

  if(r&&!hasBank(r.rf&&r.rf.to)&&ref.length<2){toast('ใส่หมายเหตุว่าคืนเงินอย่างไร');return;}
  const btn=document.querySelector('[data-act="aRefundPaidGo"]');if(btn)btn.disabled=true;
  const j=await rpc('adminRental',{rid:d.rid,action:'refundPaid',ref});toast(j.msg);

ACT.loadLog=async()=>{const j=await rpc('adminLog');if(j.ok){ui.logs=j;softRender();}};
ACT.printQR=()=>{const url=appUrl();$('#printqr').innerHTML=`<h1 style="font-size:40px">${esc(S.locker?S.locker.name:'CamLock')}</h1><p style="font-size:20px">สแกนเพื่อเช่า/คืนกล้อง</p>${QR.svg(url)}<p style="font-size:22px;font-family:monospace">${esc(url)}</p>`;window.print();};

/* ---------- ฟอร์มเข้าสู่ระบบ ---------- */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='authForm')return;e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)),reg=ui.authMode==='register';
  if(reg&&f.pass!==f.pass2){toast('รหัสผ่านไม่ตรงกัน');return;}
  const b=$('#authBtn');b.disabled=true;
  const j=await rpc(reg?'register':'login',f);
  b.disabled=false;
  if(!j.ok){toast(j.msg);return;}
  token=j.token;localStorage.setItem('cl_t',token);me=j.user;
  await Promise.all([loadMe(),loadAdmin()]);
  route={tab:isAdmin()?'a_home':'home',stack:[]};render(true);toast(reg?'สมัครสมาชิกเรียบร้อย':'ยินดีต้อนรับ '+firstName());
});

/* =====================================================================
   รอบอัปเดตอัตโนมัติ
   ===================================================================== */
let tick=0;
async function loop(){
  tick++;
  if(online&&S.lastSeen&&Date.now()-S.lastSeen>50000){online=false;watchOnline();softRender();}
  else if(!online&&statusKnown&&tick%5===0)renderBanner();
  const c=cur().name, fast=c==='open';
  if(live?(tick%15===0):(fast||tick%3===0))await loadStatus();
  else if(cur().name==='a_home'){const t=$('#lastSeen');if(t)t.textContent=S.lastSeen?dur((Date.now()-S.lastSeen)/1000)+'ที่แล้ว':'-';}
  if(me&&(tick%20===0||(fast&&tick%2===0)||(c==='pay'&&tick%4===0)))await loadMe();
  if(me&&!isAdmin()&&tick%5===0)checkDue();
  if(isAdmin()&&(c==='a_home'||c==='a_rent')&&tick%(live?30:10)===0)await loadAdmin();
  if(me){
    if(c==='active'||c==='a_rent'||c==='pay'||c==='open'||c==='home'||c==='verify'||c==='wallet'||(c==='a_home'&&tick%5===0)||(c==='a_set'&&tick%5===0))softRender();
    else renderTabs();
  }
  setTimeout(loop,1000);
}
// นาฬิกานับถอยหลังเดินทุกวินาทีโดยไม่ต้องรอ
async function boot(){
  // เปิดเว็บได้ทันทีด้วยข้อมูลล่าสุดที่จำไว้ แล้วค่อยอัปเดตจากตู้ (ไม่ต้องรอตู้ตอบ)
  const c=token&&readCache('cl_me');
  if(c&&c.user){me=c.user;myRentals=c.rentals||[];cams=c.cams||[];if(c.wal)WAL=c.wal;usingCache=true;
    const a=readCache('cl_ad');if(a&&a.rentals&&me.admin)AD=a;route={tab:isAdmin()?'a_home':'home',stack:[]};}
  ui.booting=!!token&&!me;render(true);
  await loadStatus();
  if(token){const had=!!me;const j=await loadMe();
    if(me){await loadAdmin();if(!had)route={tab:isAdmin()?'a_home':'home',stack:[]};}
    else if(j&&j.code===401)logoutLocal();}
  ui.booting=false;render(!usingCache);loop();
  if(notifyOn())regSW();
}

boot();
